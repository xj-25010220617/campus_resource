name: Deploy Backend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 进入项目目录
            cd /www/wwwroot/campus_resource

            # 拉取最新代码
            git pull origin main

            # 进入后端目录
            cd backend

            # 激活虚拟环境并安装依赖
            source venv/bin/activate
            pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

            # 执行数据库迁移（含 admin_panel 审计表）
            python manage.py migrate

            # 后端由 systemd 托管（campus-backend.service），部署后重启即可，
            # 进程死亡由 systemd 自动拉起，不再依赖 SSH 会话里的 nohup。
            systemctl restart campus-backend

            # 健康检查：后端未起来则本次部署失败，避免"部署绿但服务挂"的静默失败
            sleep 3
            curl -sf http://127.0.0.1:3000/api/docs/ || { echo "后端启动失败"; exit 1; }