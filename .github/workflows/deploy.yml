name: Deploy Backend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # torch/nvidia CUDA 依赖单个 wheel 达数百 MB，10 分钟默认超时不够
          command_timeout: 30m
          script: |
            # 串行化部署：GitHub 偶发会对同一 push 重复触发两条流水线，
            # 两个部署进程并发访问 Milvus Lite 单文件（嵌入式、不支持多进程并发）
            # 会导致重灌互相踩踏；这里用 flock 排队，最多等 15 分钟
            exec 9>/tmp/campus_deploy.lock
            flock -w 900 9 || { echo "等待另一部署实例超时"; exit 1; }

            # 进入项目目录
            cd /www/wwwroot/campus_resource

            # 拉取最新代码
            git pull origin main

            # 进入后端目录
            cd backend

            # 激活虚拟环境并安装依赖
            # 阿里云镜像：服务器为阿里云 ECS，走内网级带宽；教育网源对云主机限速，
            # torch 的 nvidia CUDA 依赖（cudnn 单包 553MB）曾因此超时
            source venv/bin/activate
            pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/

            # 执行数据库迁移（含 admin_panel 审计表）
            python manage.py migrate

            # Milvus 向量库为空时自动重灌：先停后端，避免 reindex 与运行中的后端
            # 并发访问 Milvus Lite 文件（嵌入式单进程，不支持多进程并发），灌完再启动。
            # --if-empty 保证已有数据时跳过；失败不阻断部署（后端仍会启动），但打印醒目告警。
            systemctl stop campus-backend || true
            python scripts/reindex_all.py --if-empty || echo "⚠️ Milvus 重索引失败，请登录服务器手动执行：python scripts/reindex_all.py"
            systemctl start campus-backend

            # 健康检查：后端未起来则本次部署失败，避免"部署绿但服务挂"的静默失败
            sleep 3
            curl -sf http://127.0.0.1:3000/api/docs/ || { echo "后端启动失败"; exit 1; }