```yaml
name: Deploy Backend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          # 依赖安装仅在 requirements.txt 发生变化时执行。
          # 普通代码部署不会再触发 pip install。
          command_timeout: 30m

          script: |
            set -e

            # ============================================================
            # 1. 部署串行锁
            # ============================================================
            # 防止 GitHub Actions 同时触发多个部署，
            # 尤其避免 Milvus Lite 单文件被多个重灌进程同时访问。
            exec 9>/tmp/campus_deploy.lock
            flock -w 900 9 || {
              echo "等待另一部署实例超时"
              exit 1
            }

            echo "========================================"
            echo "开始部署"
            echo "========================================"

            # ============================================================
            # 2. 清理残留的旧重灌进程
            # ============================================================
            if pkill -f '^python .*reindex_all' 2>/dev/null; then
              echo "已终止残留的旧重灌进程，等待后台单元收尾..."
              sleep 5
            fi

            # ============================================================
            # 3. 进入项目目录
            # ============================================================
            cd /www/wwwroot/campus_resource

            # ============================================================
            # 4. 记录 git pull 前的版本
            # ============================================================
            OLD_COMMIT=$(git rev-parse HEAD)

            echo "部署前版本：$OLD_COMMIT"

            # ============================================================
            # 5. 拉取最新代码
            # ============================================================
            echo "正在拉取最新代码..."

            timeout 300 git pull origin main || {
              echo "git pull 超时/失败"
              exit 1
            }

            NEW_COMMIT=$(git rev-parse HEAD)

            echo "部署后版本：$NEW_COMMIT"

            # ============================================================
            # 6. 判断 requirements.txt 是否发生变化
            # ============================================================
            REQUIREMENTS_CHANGED="false"

            if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then

              if git diff --quiet \
                "$OLD_COMMIT" "$NEW_COMMIT" -- \
                backend/requirements.txt
              then
                echo "requirements.txt 未发生变化"
              else
                REQUIREMENTS_CHANGED="true"
                echo "⚠️ requirements.txt 发生变化，需要检查/安装依赖"
              fi

            else
              echo "代码没有产生新的提交"
            fi

            # ============================================================
            # 7. 进入后端目录并激活虚拟环境
            # ============================================================
            cd /www/wwwroot/campus_resource/backend

            source venv/bin/activate

            # ============================================================
            # 8. 仅在 requirements.txt 变化时安装依赖
            # ============================================================
            if [ "$REQUIREMENTS_CHANGED" = "true" ]; then

              echo "========================================"
              echo "requirements.txt 已变化"
              echo "开始安装 Python 依赖"
              echo "========================================"

              pip install \
                -r requirements.txt \
                -i https://mirrors.aliyun.com/pypi/simple/ \
                --disable-pip-version-check \
                --no-input \
                --prefer-binary

              echo "依赖安装完成"

            else

              echo "========================================"
              echo "requirements.txt 未变化"
              echo "跳过 pip install"
              echo "========================================"

            fi

            # ============================================================
            # 9. Django 数据库迁移
            # ============================================================
            echo "执行数据库迁移..."

            python manage.py migrate

            # ============================================================
            # 10. 标记 Milvus 需要重灌
            # ============================================================
            # 当前策略：每次代码部署都触发一次 --if-empty。
            # 如果你的 reindex_all.py 本身会根据状态判断是否真正重灌，
            # 则保留这里的标记。
            #
            # ⚠️ 这是之前一次性恢复旧数据留下的逻辑。
            # 如果确认当前 Milvus 数据已经完整，可以后续单独删除。
            touch /tmp/campus_reindex_incomplete

            # ============================================================
            # 11. 停止后端
            # ============================================================
            echo "停止 campus-backend..."

            systemctl stop campus-backend || true

            # ============================================================
            # 12. 后台执行 Milvus 重灌
            # ============================================================
            # reindex 不再占用 GitHub Actions SSH 会话。
            #
            # 独立锁：
            # /tmp/campus_reindex.lock
            #
            # 最长等待 2 小时。
            #
            # stdin -> /dev/null
            # stdout/stderr -> 日志文件
            # 防止后台进程继承 SSH PTY 导致 GitHub Actions 一直等待。
            nohup bash -c '
              exec 9>/tmp/campus_reindex.lock

              flock -w 7200 9 || {
                echo "等待重灌锁超时，放弃本次重灌"
                exit 0
              }

              cd /www/wwwroot/campus_resource/backend

              source venv/bin/activate

              echo "========================================"
              echo "开始 Milvus 重灌：$(date)"
              echo "========================================"

              python scripts/reindex_all.py --if-empty

              REINDEX_EXIT=$?

              echo "Milvus 重灌结束，exit=$REINDEX_EXIT"

              if [ "$REINDEX_EXIT" -eq 0 ]; then
                echo "Milvus 重灌成功"
              else
                echo "⚠️ Milvus 重灌失败"
              fi

              echo "启动 campus-backend..."

              systemctl start campus-backend

              echo "campus-backend 已启动"

              exit "$REINDEX_EXIT"

            ' < /dev/null >> /tmp/campus_reindex_bg.log 2>&1 &

            # ============================================================
            # 13. 健康检查
            # ============================================================
            # 两种情况视为部署阶段成功：
            #
            # A. reindex_all.py 正在后台执行
            #    → 后端暂时停机属于预期
            #
            # B. 后端已经正常启动
            #
            # 最多等待 3 分钟。
            echo "等待部署状态..."

            for i in $(seq 1 36); do

              if pgrep -f "scripts/reindex_all.py" > /dev/null; then
                echo "========================================"
                echo "后台 Milvus 重灌正在进行"
                echo "重灌完成后将自动启动后端"
                echo "部署 SSH 阶段完成"
                echo "========================================"
                exit 0
              fi

              if curl -sf \
                http://127.0.0.1:3000/api/docs/ \
                > /dev/null
              then
                echo "========================================"
                echo "后端健康检查通过"
                echo "部署成功"
                echo "========================================"
                exit 0
              fi

              sleep 5
            done

            # ============================================================
            # 14. 部署失败
            # ============================================================
            echo "========================================"
            echo "部署失败"
            echo "后端未启动且没有检测到重灌进程"
            echo "========================================"

            echo "最近的重灌日志："
            tail -n 50 /tmp/campus_reindex_bg.log || true

            exit 1
```
