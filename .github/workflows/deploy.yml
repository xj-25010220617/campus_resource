name: Deploy Backend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            powershell -Command "
            Set-Location C:/wwwroot/campus_resource
            git pull origin main
            Set-Location backend
            ./venv/Scripts/python.exe -m pip install -r requirements.txt
            ./venv/Scripts/python.exe manage.py migrate
            $port = 3000
            $pid = (Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | Select-Object -First 1).OwningProcess
            if ($pid) { Stop-Process -Id $pid -Force; Write-Host 'Killed old Django (PID:' $pid ')' } else { Write-Host 'No old Django on port' $port }
            Start-Sleep 1
            Start-Process -FilePath './venv/Scripts/python.exe' -ArgumentList 'manage.py','runserver','0.0.0.0:3000' -WorkingDirectory 'C:/wwwroot/campus_resource/backend' -WindowStyle Hidden
            Write-Host 'Django started on port' $port
            Start-Sleep 2
            Invoke-WebRequest -Uri 'http://localhost:3000/api/docs/' -UseBasicParsing -TimeoutSec 5 | Select-Object -ExpandProperty StatusCode
            "
