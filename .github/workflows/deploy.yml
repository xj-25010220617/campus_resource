name: Deploy Backend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 进入项目目录
            cd /www/wwwroot/campus_resource

            # 拉取最新代码
            git pull origin main

            # 进入后端目录
            cd backend

            # 激活虚拟环境并安装依赖
            source venv/bin/activate
            pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

            # 执行数据库迁移
            python manage.py migrate

            # 设置端口
            PORT=3000

            # 杀掉旧进程（如果存在）
            PID=$(lsof -t -i:$PORT)
            if [ -n "$PID" ]; then
              kill -9 $PID
              echo "已杀掉旧进程 (PID: $PID)"
            else
              echo "端口 $PORT 上没有运行中的进程"
            fi

            # 启动新进程（后台运行）
            nohup python manage.py runserver 0.0.0.0:$PORT > /tmp/backend.log 2>&1 &

            # 等待2秒并检查服务状态
            sleep 2
            curl -s -o /dev/null -w "HTTP状态码: %{http_code}\n" http://localhost:$PORT/api/docs/