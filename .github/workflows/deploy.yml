name: Deploy Backend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script_stop: true

          script: |
            set -e

            cd /www/wwwroot/campus_resource

            echo "========================================"
            echo "开始部署"
            echo "========================================"

            echo "1. 获取当前提交"
            OLD_COMMIT=$(git rev-parse HEAD)
            echo "OLD_COMMIT=$OLD_COMMIT"

            echo "2. 清理残留的 reindex 进程"
            pkill -f '^python .*reindex_all' || true
            sleep 2

            echo "3. 拉取最新代码"
            timeout 300 git pull origin main

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "NEW_COMMIT=$NEW_COMMIT"

            echo "4. 判断 requirements.txt 是否发生变化"

            REQUIREMENTS_CHANGED=false

            if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
              if git diff --quiet "$OLD_COMMIT" "$NEW_COMMIT" -- backend/requirements.txt; then
                echo "requirements.txt 没有变化"
              else
                echo "requirements.txt 已变化"
                REQUIREMENTS_CHANGED=true
              fi
            else
              echo "没有新的提交"
            fi

            echo "5. 激活 Python 虚拟环境"
            cd /www/wwwroot/campus_resource/backend
            source venv/bin/activate

            echo "6. 检查 Python"
            python --version
            pip --version

            if [ "$REQUIREMENTS_CHANGED" = true ]; then
              echo "========================================"
              echo "requirements.txt 已变化，开始安装依赖"
              echo "========================================"

              pip install \
                -r requirements.txt \
                -i https://mirrors.aliyun.com/pypi/simple/ \
                --disable-pip-version-check \
                --no-input \
                --prefer-binary

              echo "依赖安装完成"
            else
              echo "========================================"
              echo "requirements.txt 没有变化"
              echo "跳过 pip install"
              echo "========================================"
            fi

            echo "7. 执行数据库迁移"
            python manage.py migrate --noinput

            echo "8. 标记 reindex 需要继续检查"
            touch /tmp/campus_reindex_incomplete

            echo "9. 停止后端服务"
            systemctl stop campus-backend || true

            echo "10. 后台启动 reindex"

            nohup bash -c '
              cd /www/wwwroot/campus_resource/backend
              source venv/bin/activate

              flock -w 7200 /tmp/campus_reindex.lock \
                python scripts/reindex_all.py --if-empty

              REINDEX_EXIT=$?

              echo "reindex exit code: $REINDEX_EXIT"

              if [ "$REINDEX_EXIT" -eq 0 ]; then
                rm -f /tmp/campus_reindex_incomplete
                echo "reindex 完成"
              else
                echo "reindex 失败，保留 incomplete 标记"
              fi

              systemctl start campus-backend

              exit "$REINDEX_EXIT"
            ' </dev/null >> /tmp/campus_reindex_bg.log 2>&1 &

            echo "11. 等待服务启动"

            for i in $(seq 1 36); do
              if pgrep -f "scripts/reindex_all.py" > /dev/null; then
                echo "reindex 正在后台运行，部署继续"
                break
              fi

              if curl -fsS http://127.0.0.1:3000/api/docs/ > /dev/null; then
                echo "后端服务已经启动"
                break
              fi

              echo "等待后端启动... $i/36"
              sleep 5
            done

            echo "12. 最终健康检查"

            if curl -fsS http://127.0.0.1:3000/api/docs/ > /dev/null; then
              echo "========================================"
              echo "部署成功"
              echo "========================================"
            elif pgrep -f "scripts/reindex_all.py" > /dev/null; then
              echo "========================================"
              echo "reindex 正在后台运行，部署成功"
              echo "========================================"
            else
              echo "========================================"
              echo "后端启动失败"
              echo "========================================"

              echo "最近 reindex 日志："
              tail -n 100 /tmp/campus_reindex_bg.log || true

              exit 1
            fi
