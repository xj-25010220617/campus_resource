name: Deploy Backend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # torch/nvidia CUDA 依赖单个 wheel 达数百 MB，10 分钟默认超时不够
          command_timeout: 30m
          script: |
            # 串行化部署：GitHub 偶发会对同一 push 重复触发两条流水线，
            # 两个部署进程并发访问 Milvus Lite 单文件（嵌入式、不支持多进程并发）
            # 会导致重灌互相踩踏；这里用 flock 排队，最多等 15 分钟
            exec 9>/tmp/campus_deploy.lock
            flock -w 900 9 || { echo "等待另一部署实例超时"; exit 1; }

            # 清理残留的旧重灌进程（上次部署被掐断/挂起时的遗留，现场恢复第一步）：
            # 只杀 python 重灌进程（^python 锚定命令行开头，不伤其 bash 宿主单元）；
            # 其所属 bash 后台单元会顺序走到收尾行 systemctl start campus-backend，
            # 随后自身退出、释放重灌锁与 pty，挂起的上一条部署 run 也随之结束。
            # 被杀的重灌会留下中断标记，由本次部署的 --if-empty 强制全量重灌接续。
            if pkill -f '^python .*reindex_all' 2>/dev/null; then
              echo "已终止残留的旧重灌进程，等待其后台单元收尾..."
              sleep 5
            fi

            # 进入项目目录
            cd /www/wwwroot/campus_resource

            # 拉取最新代码（服务器直连 GitHub 间歇慢，5 分钟拉不下来就 fail fast，
            # 避免无超时保护地挂死整个部署）
            timeout 300 git pull origin main || { echo "git pull 超时/失败"; exit 1; }

            # 进入后端目录
            cd backend

            # 激活虚拟环境并安装依赖
            # 阿里云镜像：服务器为阿里云 ECS，走内网级带宽；教育网源对云主机限速，
            # torch 的 nvidia CUDA 依赖（cudnn 单包 553MB）曾因此超时
            source venv/bin/activate
            pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/

            # 执行数据库迁移（含 admin_panel 审计表）
            python manage.py migrate

            # ⚠️ 一次性修复（重灌完成后请删除这两行）：上一次部署的重灌在 SSH 会话内
            # 同步执行，被 30 分钟 command_timeout 掐死，留下部分向量数据但没有
            # 中断标记（旧版脚本无标记逻辑）。手动创建标记让本次 --if-empty 强制
            # 全量重灌；reindex_all.py 正常跑完后会自动删除标记。
            touch /tmp/campus_reindex_incomplete

            # Milvus 向量库自动重灌：改在后台（nohup）执行，不再占用 SSH 会话——
            # 扫描件 OCR 单篇可达数分钟，全库重灌会超 30 分钟 command_timeout，
            # 同步执行必被掐死且后端停在停机状态。后台单元灌完自动拉起后端。
            # 先停后端：reindex 不能与运行中的后端并发访问 Milvus Lite 单文件。
            # 后台单元持独立 reindex 锁：部署锁早已释放，后续部署的重灌单元在此
            # 排队（最多 2 小时），不会并发踩踏 Milvus Lite。
            # 注意：bash -c 内的 exec 9> 会替换继承自父 shell 的部署锁 fd，
            # 因此部署锁仍会在主脚本退出后正常释放，不会形成死锁。
            # stdin 必须重定向 < /dev/null：否则后台进程继承 SSH 会话的 pty stdin，
            # sshd 要等 pty 引用清零才关闭会话，导致部署 run 挂到重灌结束（超时假死）。
            systemctl stop campus-backend || true
            nohup bash -c '
              exec 9>/tmp/campus_reindex.lock
              flock -w 7200 9 || { echo "等待重灌锁超时，放弃本次重灌（后端由正在跑的重灌完成后拉起）"; exit 0; }
              cd /www/wwwroot/campus_resource/backend
              source venv/bin/activate
              python scripts/reindex_all.py --if-empty || echo "⚠️ Milvus 重索引异常退出（exit $?），日志：/tmp/campus_reindex_bg.log"
              systemctl start campus-backend
            ' < /dev/null >> /tmp/campus_reindex_bg.log 2>&1 &

            # 健康检查（双条件，满足其一即部署成功）：
            #   a) 后台重灌正在进行（含排队等待，后端预期停机、灌完自动启动）
            #   b) 后端已启动（重灌被跳过或已快速完成的场景）
            # 循环最多 3 分钟，避免"部署绿但服务挂"的静默失败。
            for i in $(seq 1 36); do
              if pgrep -f "scripts/reindex_all.py" > /dev/null; then
                echo "后台重灌进行中（完成后自动启动后端），部署成功"
                exit 0
              fi
              if curl -sf http://127.0.0.1:3000/api/docs/ > /dev/null; then
                echo "后端健康检查通过"
                exit 0
              fi
              sleep 5
            done
            echo "后端未启动且无重灌进程运行，部署失败"
            exit 1