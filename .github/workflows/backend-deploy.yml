name: Deploy Backend to Server

on:
  push:
    branches:
      - main
  # 手动触发：仅在换 embedding 模型、改分块逻辑、或向量库损坏时使用。
  # 正常 push 部署不会重建向量库。
  workflow_dispatch:
    inputs:
      reindex:
        description: "强制全量重建向量库（会停服 20~40 分钟）"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3

        # ⚠️ 严禁再加 script_stop: true —— 2026-09-24 生产事故根因。
        #
        # script_stop 并不是简单的 "set -e"，它会让 drone-ssh 把脚本按行拆开，
        # 并在每一行之后插入一行退出码检查：
        #   DRONE_SSH_PREV_COMMAND_EXIT_CODE=$? ; if [ $.. -ne 0 ]; then exit $..; fi;
        # 而 shell 里 if 条件为假时，进入 else 分支那一刻 $? 仍然是 1（正是那个
        # 失败的判断条件），于是插入的检查会在任何 else / elif 分支入口直接 exit 1：
        # 脚本静默中止、日志没有任何报错，只留下 "Process exited with status 1"。
        #
        # "失败即停" 已经由脚本内的 set -e 承担，效果完全相同，且不会改写脚本。
        # 另有一道 trap ERR 会把真正出错的行号打到日志里。
        #
        # ⚠️ 2026-10-21 调整（502 事故后）：
        #   1. 不再每次部署都 touch /tmp/campus_reindex_incomplete。
        #      该标记是 reindex_all.py 的「上次重灌被中断」信号，只能由脚本自己
        #      在真正开始重灌时创建、正常完成时删除。部署脚本预先 touch 会让
        #      --if-empty 永远走进「强制全量」，每次都重灌 197 篇、停服 20~30 分钟。
        #   2. 不再 pkill 正在跑的 reindex（杀掉 → 标记留存 → 下次又全量，死循环）。
        #   3. 正常部署改为 HUP 平滑重载 gunicorn，停服窗口从 20~30 分钟降到 0~3 秒。
        #   4. 需要重灌时先停 celery（省下 2.9GB embedding 模型内存并释放 Milvus
        #      单文件锁，这是 17:06 reindex 被 OOM 杀掉的直接原因），且无论重灌成功
        #      还是失败都会把后端重新拉起来，绝不再出现「重灌被杀、服务一直不启动」。
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # 重灌路径需要 20~40 分钟，留足余量
          command_timeout: 60m

          script: |
            set -e

            # 任何命令失败立即中止，并把出错行号打到日志，杜绝"静默 exit 1"。
            # 被 || true 或 if/while 条件正常处理的失败不会触发（与 set -e 语义一致）。
            trap 'echo "!!! 部署中止：脚本第 $LINENO 行命令失败" >&2' ERR 2>/dev/null || true

            APP_DIR=/www/wwwroot/campus_resource
            MARKER=/tmp/campus_reindex_incomplete
            REINDEX_LOG=/tmp/campus_reindex_bg.log
            cd "$APP_DIR"

            echo "========================================"
            echo "开始部署（服务器 $(hostname) / $APP_DIR）"
            echo "========================================"

            echo "1. 获取当前提交"
            OLD_COMMIT=$(git rev-parse HEAD)
            echo "OLD_COMMIT=$OLD_COMMIT"

            echo "2. 检查是否有正在运行的重灌（不杀掉它）"
            if pgrep -f "scripts/reindex_all.py" > /dev/null; then
              echo "检测到正在运行的重灌，等待其结束（最多 30 分钟）"
              for i in $(seq 1 180); do
                pgrep -f "scripts/reindex_all.py" > /dev/null || break
                sleep 10
              done
              if pgrep -f "scripts/reindex_all.py" > /dev/null; then
                echo "警告：重灌仍在运行，本次部署继续（知识库检索可能暂时降级）"
              else
                echo "重灌已结束，继续部署"
              fi
            else
              echo "没有正在运行的重灌"
            fi

            echo "3. 拉取最新代码"
            timeout 300 git fetch origin main
            git reset --hard origin/main

            echo "3.5 重放本地补丁（OSS 预签名 / embedding 单例 / milvus 索引）"
            bash /home/ubuntu/apps/patches/apply_fixes.sh || echo "警告：补丁脚本返回非 0，继续"

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "NEW_COMMIT=$NEW_COMMIT"

            echo "4. 判断 requirements.txt 是否发生变化"
            REQUIREMENTS_CHANGED=false
            if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
              if git diff --quiet "$OLD_COMMIT" "$NEW_COMMIT" -- backend/requirements.txt; then
                echo "requirements.txt 没有变化"
              else
                echo "requirements.txt 已变化"
                REQUIREMENTS_CHANGED=true
              fi
            else
              echo "没有新的提交"
            fi
            echo "DEBUG: REQUIREMENTS_CHANGED=$REQUIREMENTS_CHANGED (OLD=$OLD_COMMIT NEW=$NEW_COMMIT)"

            echo "5. 激活 Python 虚拟环境"
            cd "$APP_DIR/backend"
            source venv/bin/activate

            echo "6. 检查 Python"
            python --version
            pip --version

            if [ "$REQUIREMENTS_CHANGED" = true ]; then
              echo "========================================"
              echo "requirements.txt 已变化，开始安装依赖"
              echo "========================================"
              pip install \
                -r requirements.txt \
                -i https://mirrors.aliyun.com/pypi/simple/ \
                --disable-pip-version-check \
                --no-input \
                --prefer-binary
              echo "依赖安装完成"
            else
              echo "========================================"
              echo "requirements.txt 没有变化，跳过 pip install"
              echo "========================================"
            fi

            echo "7. 执行数据库迁移"
            python manage.py migrate --noinput

            echo "8. 判断是否需要重建向量库"
            NEED_REINDEX=0
            REINDEX_REASON=""

            FORCE_REINDEX="${{ inputs.reindex }}"
            if [ "$FORCE_REINDEX" = "true" ]; then
              NEED_REINDEX=1
              REINDEX_REASON="手动触发（workflow_dispatch reindex=true）"
            fi

            if [ -e "$MARKER" ]; then
              NEED_REINDEX=1
              REINDEX_REASON="${REINDEX_REASON}上次重灌被中断（$MARKER 存在）"
            fi

            if [ "$NEED_REINDEX" = "1" ]; then
              echo "需要重建：$REINDEX_REASON"
            else
              echo "向量库无需重建，跳过 reindex（正常部署路径）"
            fi

            echo "9. 应用新代码"
            if [ "$NEED_REINDEX" = "1" ]; then
              # ── 重灌路径：必须独占 Milvus（单文件锁），停服期间完成 ──
              echo "========================================"
              echo "开始重建向量库，期间后端不可用（预计 20~40 分钟）"
              echo "原因：$REINDEX_REASON"
              echo "========================================"

              echo "9.1 停止 celery（释放 Milvus 锁 + 约 2.9GB embedding 模型内存）"
              sudo -n systemctl stop campus-celery || true
              sleep 3

              echo "9.2 停止后端"
              sudo -n systemctl stop campus-backend || true

              echo "9.3 前台执行全量重灌（日志同时落盘 $REINDEX_LOG）"
              set +e
              flock -w 60 /tmp/campus_reindex.lock \
                python scripts/reindex_all.py >> "$REINDEX_LOG" 2>&1
              REINDEX_EXIT=$?
              set -e

              echo "reindex exit code: $REINDEX_EXIT"
              tail -n 40 "$REINDEX_LOG" || true

              if [ "$REINDEX_EXIT" -eq 0 ]; then
                rm -f "$MARKER"
                echo "重灌成功，中断标记已清除"
              else
                echo "!!! 重灌失败（exit=$REINDEX_EXIT），保留中断标记，下次部署会重试"
              fi

              echo "9.4 无论重灌成败，都把服务拉起来（避免一直 502）"
              sudo -n systemctl start campus-celery || true
              sleep 2
              sudo -n systemctl start campus-backend || true

              if [ "$REINDEX_EXIT" -ne 0 ]; then
                echo "本次部署判定为失败：代码已更新、服务已恢复，但向量库不完整"
                exit 1
              fi
            else
              # ── 正常路径：不停服，HUP 平滑重载 gunicorn ──
              echo "平滑重载 gunicorn（master 不退出，端口不断）"
              if sudo -n systemctl is-active --quiet campus-backend; then
                if sudo -n systemctl kill -s HUP --kill-who=main campus-backend; then
                  echo "已发送 HUP，等待 worker 重启"
                else
                  echo "HUP 失败，回退为 restart"
                  sudo -n systemctl restart campus-backend
                fi
              else
                echo "后端当前未运行，直接启动"
                sudo -n systemctl start campus-backend
              fi

              # celery 代码可能也变了，但 restart 会重新加载模型（约 2.9GB）。
              # 只在新提交确实改了任务代码时才重启，避免无谓的内存抖动。
              if [ "$OLD_COMMIT" != "$NEW_COMMIT" ] && \
                 ! git diff --quiet "$OLD_COMMIT" "$NEW_COMMIT" -- backend/apps/knowledge/tasks.py backend/config/celery.py 2>/dev/null; then
                echo "任务代码有变化，重启 celery"
                sudo -n systemctl restart campus-celery || true
              else
                echo "任务代码无变化，保持 celery 运行"
              fi
            fi

            echo "10. 健康检查（最多 120 秒）"
            HEALTHY=0
            for i in $(seq 1 24); do
              if curl -fsS http://127.0.0.1:3000/api/docs/ > /dev/null 2>&1; then
                HEALTHY=1
                echo "后端在线（第 $i 次探测）"
                break
              fi
              echo "等待后端启动... $i/24"
              sleep 5
            done

            echo "11. 结果"
            if [ "$HEALTHY" = "1" ]; then
              echo "========================================"
              echo "部署成功：$NEW_COMMIT"
              echo "后端 http://127.0.0.1:3000/api/docs/ -> 200"
              echo "========================================"
            else
              echo "========================================"
              echo "部署失败：后端未在 120 秒内就绪"
              echo "========================================"
              sudo -n systemctl status campus-backend --no-pager -l | tail -n 30 || true
              echo "后端错误日志："
              tail -n 50 /home/ubuntu/apps/logs/backend-error.log || true
              exit 1
            fi
