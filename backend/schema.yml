openapi: 3.0.3
info:
  title: 校园虚拟资源管理系统 API
  version: 1.0.0
  description: 成都东软学院校园资源管理平台接口文档
paths:
  /api/admin/colleges/:
    get:
      operationId: admin_colleges_list
      description: |-
        学院列表查询接口

        GET /api/admin/colleges/
        返回：所有学院列表，按 sort_order 排序
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCollegeList'
          description: ''
  /api/admin/users/:
