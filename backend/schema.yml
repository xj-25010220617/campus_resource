components:
  schemas:
    BatchResetPassword:
      type: object
      description: 批量重置密码序列化器
      properties:
        user_ids:
          type: array
          items:
            type: integer
            minimum: 1
          description: 用户ID列表（最多100个）
          maxItems: 100
          minItems: 1
        new_password:
          type: string
          description: 新密码（必填）
      required:
      - new_password
      - user_ids
    BatchResetPasswordRequest:
      type: object
      description: 批量重置密码序列化器
      properties:
        user_ids:
          type: array
          items:
            type: integer
            minimum: 1
          description: 用户ID列表（最多100个）
          maxItems: 100
          minItems: 1
        new_password:
          type: string
          minLength: 1
          description: 新密码（必填）
      required:
      - new_password
      - user_ids
    Category:
      type: object
      description: 资源类型序列化器（树形，含图标继承）
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: 类型名称
          maxLength: 64
        parent:
          type: integer
          nullable: true
          title: 上级分类
        icon:
          type: string
          readOnly: true
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: 排序
        children:
          type: string
          readOnly: true
      required:
      - children
      - icon
      - id
      - name
    CategoryEnum:
      enum:
      - 工学
      - 管理学
      - 艺术学
      - 文学
      - 医学
      type: string
      description: |-
        * `工学` - 工学
        * `管理学` - 管理学
        * `艺术学` - 艺术学
        * `文学` - 文学
        * `医学` - 医学
    ChatMessage:
      type: object
      description: 聊天消息序列化器（只读）
      properties:
        id:
          type: integer
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ChatMessageRoleEnum'
          readOnly: true
          title: 角色
        content:
          type: string
          readOnly: true
          title: 消息内容
        references:
          readOnly: true
          title: 引用的资源列表
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - content
      - created_at
      - id
      - references
      - role
    ChatMessageRoleEnum:
      enum:
      - user
      - assistant
      type: string
      description: |-
        * `user` - 用户
        * `assistant` - AI助手
    College:
      type: object
      description: 学院列表序列化器
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: 学院名称
          maxLength: 64
        code:
          type: string
          title: 学院代码
          maxLength: 16
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: 排序
      required:
      - code
      - id
      - name
    Conversation:
      type: object
      description: 会话序列化器（只读）
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          title: 会话标题
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
      required:
      - created_at
      - id
      - messages
      - title
      - updated_at
    ConversationList:
      type: object
      description: 会话列表序列化器（不含 messages）
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          title: 会话标题
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
      required:
      - created_at
      - id
      - title
      - updated_at
    Discipline:
