# ===========================================================================
# P1-2 Phase 1-2 / 审计报告 P-5：端口与域名说明
#
# 端口：本文件此前指向 8000，而 `start.bat` 用的是 3000 —— 两个文件不一致，
# 部署时以哪个为准只能靠猜。本阶段统一为 8000（nginx 是唯一外网入口，以它
# 为准），生产入口 `deploy\start_web.bat` 的 CAMPUS_PORT 默认值同样是 8000。
# ⚠️ 但**生产实际端口未经验证**（开发机不可达生产），交付报告中标记为
#    PRODUCTION_PORT_NOT_VERIFIED：部署时请确认，如需变更请同时修改本文件
#    的 upstream 与 start_web.bat 的 CAMPUS_PORT。
#
# 域名：**不在此硬编码生产域名**。下面的 server_name 是占位符，部署时按
# 实际域名替换，并与 Django 的 DJANGO_ALLOWED_HOSTS / CORS_ALLOWED_ORIGINS
# 保持一致（见 config/settings.py 的 P-6 校验）。
# ===========================================================================

upstream django {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    # 占位符：部署时替换为真实域名（勿把域名写进仓库）
    server_name _;

    location /api/chat/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # P1-2 Phase 1-2 / 审计报告 P-4：上传链路已与审核链解耦
    # （upload_service.schedule_moderation 只入队、绝不降级同步执行），
    # 请求线程不再跑 moderation → promotion → index。因此这里的
    # proxy_read_timeout 只需覆盖"接收并落盘对象"的耗时，120s 足够；
    # 改造前若 Celery 不可用，这条超时会直接被整条审核链跑穿。
    location /api/knowledge/upload/ {
        proxy_pass http://django;
        client_max_body_size 500m;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /path/to/staticfiles/;
        expires 30d;
    }

    location / {
        proxy_pass http://django;
        proxy_read_timeout 60s;
    }
}